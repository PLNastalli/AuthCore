name: Temporary Rustfmt Preview

on:
  push:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source and show changes
        run: |
          cargo fmt --all
          git diff -- src tests
