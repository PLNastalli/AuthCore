name: Dependency Security

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify vulnerable optional MySQL crypto is NOT compiled
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked --edges normal,build --target x86_64-unknown-linux-gnu --prefix none > /tmp/authcore-active-dependencies
          if grep -Eq '^(rsa|sqlx-mysql) v' /tmp/authcore-active-dependencies; then
            echo "Error: optional RSA/MySQL dependency became reachable in the build"
            grep -E '^(rsa|sqlx-mysql) v' /tmp/authcore-active-dependencies
            exit 1
          fi
      - name: Audit locked graph (reviewed optional-only exception)
        run: cargo audit --ignore RUSTSEC-2023-0071
